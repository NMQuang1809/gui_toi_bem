<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bạn có tò mò? 💕</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Afacad+Flux:ital,wght@0,400..700;1,400..700&family=Comfortaa:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- THAY LINK NHẠC: đổi src thành file .mp3 của bạn -->
  <audio id="bg-music" loop hidden src="tungngayyeuem.mp3"></audio>

  <main id="app">
    <!-- ========== SCREEN 0: Initial Trigger (active by default) ========== -->
    <div id="s0" class="screen screen--active screen--flex" data-screen="0">
      <div class="screen-inner s0-inner">
        <button type="button" id="btn-trigger" class="btn btn--trigger">Bắt đầu</button>
      </div>
    </div>

    <!-- ========== SCREEN 1: The Intro ========== -->
    <div id="s1" class="screen screen--flex" data-screen="1">
      <div class="bg-hearts" aria-hidden="true">
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
      </div>
      <div class="scrapbook-bg" aria-hidden="true">
        <!-- INSERT SCRAPBOOK IMAGE 1 -->
        <img class="polaroid polaroid--1" data-scrap="0" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 2 -->
        <img class="polaroid polaroid--2" data-scrap="1" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 3 -->
        <img class="polaroid polaroid--3" data-scrap="2" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 4 -->
        <img class="polaroid polaroid--4" data-scrap="3" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 5 -->
        <img class="polaroid polaroid--5" data-scrap="4" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 6 -->
        <img class="polaroid polaroid--6" data-scrap="5" src="" alt="" />
      </div>
      <div class="screen-inner s1-inner">
        <h1 class="title intro-heading">Bạn bảo Bem nghe:</h1>
        <button type="button" id="btn-watch" class="btn btn--primary">Bắt đầu xem</button>
      </div>
    </div>

    <!-- ========== SCREEN 2: The Letter ========== -->
    <div id="s2" class="screen" data-screen="2">
      <div class="bg-hearts" aria-hidden="true">
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
      </div>
      <div class="scrapbook-bg" aria-hidden="true">
        <!-- INSERT SCRAPBOOK IMAGE 1 -->
        <img class="polaroid polaroid--1" data-scrap="0" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 2 -->
        <img class="polaroid polaroid--2" data-scrap="1" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 3 -->
        <img class="polaroid polaroid--3" data-scrap="2" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 4 -->
        <img class="polaroid polaroid--4" data-scrap="3" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 5 -->
        <img class="polaroid polaroid--5" data-scrap="4" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 6 -->
        <img class="polaroid polaroid--6" data-scrap="5" src="" alt="" />
      </div>
      <article class="letter">
        <div class="letter-body">
          <div id="typewriter" class="letter-text" aria-live="polite"></div>
        </div>
        <button type="button" id="btn-next-letter" class="btn btn--next" hidden>
          Tiếp theo
        </button>
      </article>
    </div>

    <!-- ========== SCREEN 3: Confession & Challenge ========== -->
    <div id="s3" class="screen" data-screen="3">
      <div class="bg-hearts" aria-hidden="true">
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
        <span class="floating-heart">♥</span>
      </div>
      <div class="scrapbook-bg" aria-hidden="true">
        <!-- INSERT SCRAPBOOK IMAGE 1 -->
        <img class="polaroid polaroid--1" data-scrap="0" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 2 -->
        <img class="polaroid polaroid--2" data-scrap="1" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 3 -->
        <img class="polaroid polaroid--3" data-scrap="2" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 4 -->
        <img class="polaroid polaroid--4" data-scrap="3" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 5 -->
        <img class="polaroid polaroid--5" data-scrap="4" src="" alt="" />
        <!-- INSERT SCRAPBOOK IMAGE 6 -->
        <img class="polaroid polaroid--6" data-scrap="5" src="" alt="" />
      </div>
      <div class="screen-inner s3-inner">
        <h1 class="title confession-title">Bem làm người yêu Quang nhé?</h1>

        <div class="confession-media">
          <!-- INSERT GIF HERE: chỉnh GIF_URLS trong script.js -->
          <img
            id="confession-gif"
            class="confession-gif"
            src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdmJ3amU5dDNpOHl1bDRzbm05NWwyeDB0NG8zaTF3Mmp3dXZzOGx1cCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/5SbA6ZRhiI5jriUwqu/giphy.gif"
            alt="GIF dễ thương"
            width="280"
            height="280"
          />
          <p id="pleading-text" class="pleading-text"></p>
        </div>

        <div class="btn-group" id="confession-actions">
          <button type="button" id="yes-btn" class="btn btn--yes">Đồng ýyy ❤️</button>
          <button type="button" id="no-btn" class="btn btn--no">Hônggg</button>
        </div>
      </div>
    </div>

    <!-- ========== SCREEN 4: Final (Three.js + GSAP) — no scrapbook ========== -->
    <div id="s4" class="screen screen--final" data-screen="4">
      <canvas id="heart-canvas" aria-hidden="true"></canvas>
      <div id="sparkle-rain" class="sparkle-rain" aria-hidden="true"></div>
      <div id="explosion-confetti" class="explosion-confetti" aria-hidden="true"></div>
      <div id="explosion-flash" class="explosion-flash" aria-hidden="true"></div>

      <div class="final-overlay">
        <p id="final-hint" class="final-hint">
          Giữ và kéo để xoay — tìm góc nhìn chính diện để các hạt ghép thành trái tim 💕
        </p>

        <div class="final-center" id="final-center">
          <h2 id="final-title" class="title final-title" hidden>
            Yay! Cảm ơn bạn đã đồng ý làm người yêu mình ❤️✨
          </h2>

          <!-- INSERT COUPLE PHOTO HERE: chỉnh MEMORIAL_IMAGE trong script.js -->
          <div class="couple-photo-wrap" id="couple-wrap" hidden>
            <img
              id="couple-photo"
              class="couple-photo"
              src="656268617_18199510201338584_5218352067584475385_n.jpg"
              alt="Ảnh đôi"
              width="200"
              height="200"
              decoding="async"
            />
          </div>

          <p id="final-message" class="final-message" hidden></p>
        </div>
      </div>
    </div>
  </main>

  <svg class="svg-defs" width="0" height="0" aria-hidden="true">
    <defs>
      <clipPath id="heart-photo-clip" clipPathUnits="objectBoundingBox">
        <path
          d="M0.5,0.92 C0.2,0.65 0,0.45 0,0.28 C0,0.12 0.12,0 0.28,0 C0.4,0 0.5,0.1 0.5,0.1 C0.5,0.1 0.6,0 0.72,0 C0.88,0 1,0.12 1,0.28 C1,0.45 0.8,0.65 0.5,0.92 Z"
        />
      </clipPath>
    </defs>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="final-screen-3d.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
